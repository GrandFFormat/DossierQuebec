# Rafraîchissement quotidien du volet municipal (dossierquebec.ca/quebec/).
#
# Même mécanique que refresh.yml : chaque matin, on relance les extractions, et s'il y a du
# nouveau on committe et on pousse — Vercel redéploie. Tout se passe dans quebec/, qui
# a ses propres scrapers et sa propre dépendance (voir quebec/README.md).
#
# Secrets et variables (Settings > Secrets and variables > Actions) :
#   ANTHROPIC_API_KEY  secret, déjà utilisé par refresh.yml — résumés en langage clair.
#                      Sans lui, l'étape est sautée et le reste tourne.
#   GPD_CONTACT        variable, facultative — ce que notre robot laisse comme contact dans
#                      son User-Agent auprès de la Ville. À défaut : l'adresse du site.
#   SUPABASE_URL,      secrets — le détail de l'argent des nouveaux dossiers (abonnés),
#   SUPABASE_SERVICE_ROLE_KEY  publié dans Supabase. Sans eux, l'étape est sautée.

name: Rafraîchissement quotidien — volet municipal

on:
  schedule:
    # 08:30 UTC, après le rafraîchissement de DossierQuébec (08:00). Le groupe de
    # concurrence ci-dessous garantit de toute façon qu'ils ne se chevauchent pas.
    - cron: '30 8 * * *'
  workflow_dispatch: {} # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

# Son propre groupe (18 sept. 2026). Avec le groupe partagé « refresh-data », GitHub ne garde qu'UN
# run en attente : un matin où Montréal tourne longtemps, celui de Québec pouvait être annulé sans
# bruit — pas d'alertes ni de détail de l'argent ce jour-là, alors que Québec est le volet vendu.
# Deux jobs peuvent donc pousser en même temps : le push plus bas rebase et réessaie.
concurrency:
  group: refresh-quebec
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Une dizaine de requêtes vers la Ville et au plus 120 résumés : quelques minutes en
    # temps normal. 45 min laisse une marge très large sans laisser un job s'emballer.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quebec
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer la dépendance (SDK Anthropic)
        run: npm ci --omit=dev

      - name: Rafraîchir les données municipales
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GPD_CONTACT: ${{ vars.GPD_CONTACT }}
          # Détail de l'argent (réservé aux abonnés) : publié dans Supabase, qui dit aussi ce qui
          # est déjà lu. Sans ces deux secrets, l'étape est sautée et le reste tourne.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run refresh

      # Seul quebec/data/ bouge. On rebase avant de pousser au cas où quelqu'un
      # aurait poussé pendant le job.
      - name: Committer et pousser s'il y a des changements
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quebec/data
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
          else
            git commit -m "Rafraîchissement auto du volet municipal ($(date -u +%Y-%m-%d))"
            # D'autres workflows poussent sur master : on rebase et on réessaie (seul quebec/data
            # bouge ici, donc pas de conflit).
            for essai in 1 2 3; do
              git pull --rebase && git push && break
              [ "$essai" = 3 ] && { echo "::error::Push refusé trois fois — rien n'est publié aujourd'hui."; exit 1; }
              echo "Push refusé (essai $essai) — nouvel essai dans $((essai * 10)) s."
              sleep $((essai * 10))
            done
          fi

      # Le texte vient de stderr (messages d'erreur, guillemets compris) : il passe par une variable
      # d'environnement, jamais par ${{ }} dans le script, que bash réinterpréterait.
      - name: Signaler les étapes secondaires en échec
        if: ${{ !cancelled() && steps.refresh.outputs.warnings != '' }}
        env:
          AVERTISSEMENTS: ${{ steps.refresh.outputs.warnings }}
        run: |
          echo "::warning::Étapes secondaires en échec (données de la veille conservées) : $AVERTISSEMENTS"

      # Après le commit : une extraction principale en échec rend le run rouge pour qu'on
      # le voie — les données des autres étapes sont déjà publiées.
      - name: Alerter si une extraction principale a échoué
        if: ${{ !cancelled() && steps.refresh.outputs.failed != '' }}
        env:
          ECHECS: ${{ steps.refresh.outputs.failed }}
        run: |
          echo "::error::Extractions en échec (données de la veille conservées) : $ECHECS"
          exit 1

      # Même règle pour ce qui est promis aux abonnés payants (le détail de l'argent « dès le
      # lendemain ») : run rouge, donc courriel de GitHub à Martin.
      - name: Alerter si une étape promise aux abonnés a échoué
        if: ${{ !cancelled() && steps.refresh.outputs.paid_failed != '' }}
        env:
          PAYANTS: ${{ steps.refresh.outputs.paid_failed }}
        run: |
          echo "::error::Promis aux abonnés, en échec ce matin : $PAYANTS"
          exit 1
