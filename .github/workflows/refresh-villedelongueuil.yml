# Rafraîchissement quotidien du volet Longueuil (longueuil/).
#
# Même mécanique que les volets Québec, Montréal et Lévis : chaque matin, on relance les
# extractions, et s'il y a du nouveau on committe et on pousse — Vercel redéploie. Tout se passe
# dans longueuil/, qui a ses propres scrapers et ses deux dépendances (voir longueuil/README.md).
#
# Secrets et variables (Settings > Secrets and variables > Actions) :
#   ANTHROPIC_API_KEY  secret — résumés en langage clair. Sans lui, l'étape est sautée et
#                      le reste tourne.
#   LGL_CONTACT        variable, facultative — ce que notre robot laisse comme contact dans
#                      son User-Agent auprès de la Ville. À défaut : l'adresse du site.

name: Rafraîchissement quotidien — volet Longueuil

on:
  schedule:
    # 10:00 UTC, après DossierQuébec (08:00), Québec (08:30), Montréal (09:00) et Lévis (09:30),
    # pour que les journaux se lisent dans l'ordre. Ce volet a son propre groupe (voir plus bas).
    - cron: '0 10 * * *'
  workflow_dispatch: {} # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

# Son propre groupe (24 septembre 2026, comme Québec depuis le 18) : avec le groupe partagé
# « refresh-data », GitHub ne garde qu'UN run en attente, et un matin où Montréal tourne longtemps
# celui-ci était annulé sans bruit — Longueuil a sauté le 23 septembre 2026 comme ça.
# Deux jobs peuvent donc pousser en même temps : la boucle de poussée rebase et réessaie.
concurrency:
  group: refresh-longueuil
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Quelques minutes en régime établi. Le premier run sans cache retélécharge les procès-verbaux
    # des deux années (une cinquantaine de PDF, pour les votes, l'agglomération et le lexique) ;
    # un document de séance à lire ajoute une vingtaine de secondes.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: longueuil
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier que le volet est présent
        id: volet
        working-directory: .
        run: |
          if [ -f longueuil/package.json ]; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
          else
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de dossier longueuil/ sur cette branche — rien à rafraîchir."
          fi

      - name: Installer Node.js
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dépendances (SDK Anthropic, pdf.js)
        if: ${{ steps.volet.outputs.present == 'oui' }}
        run: npm ci --omit=dev

      # Le texte extrait des PDF (data/textes/, hors dépôt) d'un run à l'autre : relire une
      # séance déjà téléchargée ne redemande rien à la Ville.
      - name: Restaurer le cache de texte des PDF
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/cache/restore@v4
        with:
          path: longueuil/data/textes
          key: textes-longueuil-${{ github.run_id }}
          restore-keys: |
            textes-longueuil-

      - name: Rafraîchir les données municipales
        if: ${{ steps.volet.outputs.present == 'oui' }}
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LGL_CONTACT: ${{ vars.LGL_CONTACT }}
        run: |
          set -o pipefail
          npm run refresh 2>&1 | tee data/lancement.log

      - name: Committer et pousser s'il y a des changements
        if: ${{ steps.volet.outputs.present == 'oui' }}
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add longueuil/data
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
          else
            git commit -m "Rafraîchissement auto du volet Longueuil ($(date -u +%Y-%m-%d))"
            # Deux raisons de réessayer : un autre workflow a pu pousser pendant le job, et
            # GitHub refuse parfois le push sur une erreur interne de son côté — c'est ce qui
            # a perdu la journée du 24 septembre 2026, sans rien de cassé chez nous.
            for essai in 1 2 3; do
              git pull --rebase && git push && break
              [ "$essai" = 3 ] && { echo "::error::Push refusé trois fois — rien n'est publié aujourd'hui."; exit 1; }
              echo "Push refusé (essai $essai) — nouvel essai dans $((essai * 10)) s."
              sleep $((essai * 10))
            done
          fi

      # L'action actions/cache ne sauvegarde rien quand le job finit rouge — et nos alertes le
      # mettent en rouge exprès. Le texte des PDF était donc jeté, et le lendemain le robot les
      # redemandait à la Ville pour rien. On enregistre à part, même en cas d'échec ; si ce n'est
      # pas possible (dossier absent), tant pis, ça ne doit jamais faire échouer le run.
      - name: Enregistrer le cache de texte des PDF
        if: ${{ !cancelled() && steps.volet.outputs.present == 'oui' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: longueuil/data/textes
          key: textes-longueuil-${{ github.run_id }}

      # !cancelled() : ces deux alertes passent après la poussée, donc un push refusé les
      # sautait — une source tombée passait inaperçue. Le texte vient de stderr : il passe par
      # une variable d'environnement, jamais par ${{ }} dans le script, que bash relirait.
      - name: Signaler les étapes secondaires en échec
        if: ${{ !cancelled() && steps.volet.outputs.present == 'oui' && steps.refresh.outputs.warnings != '' }}
        env:
          AVERTISSEMENTS: ${{ steps.refresh.outputs.warnings }}
        run: |
          echo "::warning::Étapes secondaires en échec (données de la veille conservées) : $AVERTISSEMENTS"

      - name: Alerter si une extraction principale a échoué
        if: ${{ !cancelled() && steps.volet.outputs.present == 'oui' && steps.refresh.outputs.failed != '' }}
        env:
          ECHECS: ${{ steps.refresh.outputs.failed }}
        run: |
          echo "::error::Extractions en échec (données de la veille conservées) : $ECHECS"
          exit 1
