# Rafraîchissement quotidien du volet Laval (laval/).
#
# Même mécanique que les volets Québec, Montréal, Lévis et Longueuil : chaque matin, on relance
# les extractions, et s'il y a du nouveau on committe et on pousse — Vercel redéploie. Tout se
# passe dans laval/, qui a ses propres scrapers et ses deux dépendances (voir laval/README.md).
#
# Particularité de Laval : l'index des documents (laval.ca) est derrière Cloudflare, qui refuse
# tout robot. scrapers/index.js l'essaie quand même chaque jour et, refusé, garde la capture
# manuelle du dépôt (laval/data/index-documents.json) sans mettre le run en échec. Tant que la
# Ville n'a pas répondu, ce run ne trouve donc de nouvelles séances qu'après une capture faite à
# la main (laval/README.md, « Rafraîchir l'index à la main ») ; les PDF, eux, sont lus sur le
# stockage Azure de la Ville, qui est ouvert.
#
# Secrets et variables (Settings > Secrets and variables > Actions) :
#   ANTHROPIC_API_KEY  secret — résumés en langage clair. Sans lui, l'étape est sautée et
#                      le reste tourne.
#   LAV_RESUMES        variable — « oui » pour ALLUMER l'étape payante des résumés. Absente,
#                      l'étape est sautée même si la clé est là : le seul poste qui coûte de
#                      l'argent ne démarre pas parce qu'un secret a été posé, mais parce qu'on
#                      l'a décidé (estimation : environ 6 $ US pour les 511 sommaires de 2026
#                      en Batches avec claude-opus-5, moitié moins avec sonnet).
#   LAV_RESUMES_MODELE variable, facultative — « claude-sonnet-5 », « claude-haiku-4-5 »…
#                      À défaut : le modèle par défaut de scrapers/resumes.js.
#   LAV_RESUMES_BATCH  variable, facultative — « oui » pour passer par l'API Batches (moitié
#                      prix, résultats en différé).
#   LAV_CONTACT        variable, facultative — ce que notre robot laisse comme contact dans
#                      son User-Agent auprès de la Ville. À défaut : l'adresse du volet.

name: Rafraîchissement quotidien — volet Laval

on:
  schedule:
    # 10:30 UTC, après DossierQuébec (08:00), Québec (08:30), Montréal (09:00), Lévis (09:30) et
    # Longueuil (10:00). Le groupe de concurrence ci-dessous garantit de toute façon qu'ils ne se
    # chevauchent pas.
    - cron: '30 10 * * *'
  workflow_dispatch: {} # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Quelques minutes en régime établi. Le premier run sans cache retélécharge les procès-verbaux
    # et ordres du jour de l'année (environ 135 PDF en septembre 2026, à 0,6 s d'intervalle) ;
    # les sommaires décisionnels se rattrapent à raison de 120 par jour.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: laval
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier que le volet est présent
        id: volet
        working-directory: .
        run: |
          if [ -f laval/package.json ]; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
          else
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de dossier laval/ sur cette branche — rien à rafraîchir."
          fi

      - name: Installer Node.js
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dépendances (SDK Anthropic, pdf.js)
        if: ${{ steps.volet.outputs.present == 'oui' }}
        run: |
          npm ci --omit=dev

      # Le texte extrait des PDF (data/textes/, hors dépôt) d'un run à l'autre : relire une
      # séance déjà téléchargée ne redemande rien au stockage de la Ville.
      - name: Restaurer le cache de texte des PDF
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/cache@v4
        with:
          path: laval/data/textes
          key: textes-laval-${{ github.run_id }}
          restore-keys: |
            textes-laval-

      - name: Rafraîchir les données municipales
        if: ${{ steps.volet.outputs.present == 'oui' }}
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LAV_RESUMES: ${{ vars.LAV_RESUMES }}
          LAV_RESUMES_MODELE: ${{ vars.LAV_RESUMES_MODELE }}
          LAV_RESUMES_BATCH: ${{ vars.LAV_RESUMES_BATCH }}
          LAV_CONTACT: ${{ vars.LAV_CONTACT }}
        run: |
          set -o pipefail
          npm run refresh 2>&1 | tee data/lancement.log

      - name: Committer et pousser s'il y a des changements
        if: ${{ steps.volet.outputs.present == 'oui' }}
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laval/data
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
          else
            git commit -m "Rafraîchissement auto du volet Laval ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Signaler les étapes secondaires en échec
        if: ${{ steps.volet.outputs.present == 'oui' && steps.refresh.outputs.warnings != '' }}
        run: |
          echo "::warning::Étapes secondaires en échec (données de la veille conservées) : ${{ steps.refresh.outputs.warnings }}"

      - name: Alerter si une extraction principale a échoué
        if: ${{ steps.volet.outputs.present == 'oui' && steps.refresh.outputs.failed != '' }}
        run: |
          echo "::error::Extractions en échec (données de la veille conservées) : ${{ steps.refresh.outputs.failed }}"
          exit 1
