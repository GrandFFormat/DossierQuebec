# Diagnostic des conseils d'arrondissement de Montréal — à lancer à la main, pas planifié.
#
# Deux trous connus, et rien pour les combler depuis un poste de travail : les PDF de la
# Ville ne sont pas joignables ailleurs que depuis un runner. Ce workflow y fait tourner
# montreal/scrapers/diagnostic-arrondissements.js et committe son journal, pour qu'on
# puisse le LIRE — c'est le journal qui est le livrable, pas le JSON.
#
#   A. Huit conseils rendent zéro résolution sur des procès-verbaux de quinze à trente
#      pages : on imprime le texte brut pour voir sous quelle forme leurs numéros de
#      résolution sont écrits.
#   B. Le Plateau-Mont-Royal ne rend aucune séance : on essaie d'autres codes d'instance
#      et d'autres heures.
#
# Il ne touche à aucune donnée du site.

name: Diagnostic — conseils d'arrondissement de Montréal

on:
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que les rafraîchissements : deux jobs ne parlent jamais à la Ville en même
# temps, et ne se marchent pas dessus au moment de pousser.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  diagnostiquer:
    runs-on: ubuntu-latest
    # Le sondage du Plateau fait jusqu'à 900 requêtes à 0,6 s, plus neuf PDF à lire.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: montreal
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      # Le fichier peut manquer sur la branche choisie : on le dit et on s'arrête
      # proprement, comme les autres workflows du dépôt.
      - name: Vérifier que le volet est présent
        id: volet
        working-directory: .
        run: |
          if [ -f montreal/scrapers/diagnostic-arrondissements.js ]; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
          else
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de script de diagnostic sur cette branche — rien à faire."
          fi

      - name: Installer Node.js
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dépendances
        if: ${{ steps.volet.outputs.present == 'oui' }}
        run: npm ci --omit=dev

      - name: Regarder les documents
        if: ${{ steps.volet.outputs.present == 'oui' }}
        env:
          MTL_CONTACT: ${{ vars.MTL_CONTACT }}
        run: |
          set -o pipefail
          npm run diagnostic:arrondissements 2>&1 | tee data/diagnostic-arrondissements.log

      - name: Committer le journal
        if: ${{ always() && steps.volet.outputs.present == 'oui' }}
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add montreal/data/arrondissements-diagnostic.json montreal/data/diagnostic-arrondissements.log || true
          if git diff --cached --quiet; then
            echo "Aucun journal à committer."
          else
            git commit -m "Diagnostic des conseils d'arrondissement de Montréal ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
