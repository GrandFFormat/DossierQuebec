# Lire une page de la Ville de Montréal depuis un runner — à lancer à la main.
#
# Le poste de travail n'atteint pas ville.montreal.qc.ca. Quand Martin colle une adresse, ce
# workflow va la lire et committe ce qu'il y a vu : le titre, et tous les liens qui parlent de
# séances, d'ordres du jour, de procès-verbaux ou de PDF. C'est ainsi qu'on saura si une page
# cache une source de documents qu'on ne lit pas encore.

name: Découverte — une page de la Ville de Montréal

on:
  workflow_dispatch:
    inputs:
      url:
        description: "L'adresse à lire (vide : lire la page du Plateau et son dernier procès-verbal)"
        required: false
      sommaires:
        description: "Des adresses séparées par une espace : pour chacune, dire si son ordre du jour contient les sommaires décisionnels"
        required: false
      pdf:
        description: "Des adresses de PDF séparées par une espace : dire ce que chacun contient et ce que nos découpeurs en tirent"
        required: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: montreal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Lire des PDF et dire ce qu'ils contiennent
        if: ${{ inputs.pdf != '' }}
        env:
          MTL_CONTACT: ${{ vars.MTL_CONTACT }}
          MTL_URLS: ${{ inputs.pdf }}
        run: |
          set -o pipefail
          node scrapers/sonde-pdf.js 2>&1 | tee data/sonde-pdf.log

      - name: Chercher les sommaires décisionnels dans les ordres du jour
        if: ${{ inputs.sommaires != '' && inputs.pdf == '' }}
        env:
          MTL_CONTACT: ${{ vars.MTL_CONTACT }}
          # Les adresses passent par l'environnement : elles contiennent des « & », que le
          # shell couperait en tâches de fond si on les mettait sur la ligne de commande.
          MTL_URLS: ${{ inputs.sommaires }}
        run: |
          set -o pipefail
          node scrapers/sonde-sommaires.js 2>&1 | tee data/sonde-sommaires.log

      - name: Lire la page
        if: ${{ inputs.sommaires == '' && inputs.pdf == '' }}
        env:
          MTL_CONTACT: ${{ vars.MTL_CONTACT }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.url }}" ]; then
            node scrapers/decouverte-page.js "${{ inputs.url }}" 2>&1 | tee data/page-decouverte.log
          else
            node scrapers/decouverte-plateau.js 2>&1 | tee data/plateau-decouverte.log
          fi
      - name: Committer le journal
        if: always()
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add montreal/data/page-decouverte.json montreal/data/page-decouverte.log montreal/data/plateau-decouverte.json montreal/data/plateau-decouverte.log montreal/data/sonde-sommaires.json montreal/data/sonde-sommaires.log montreal/data/sonde-pdf.json montreal/data/sonde-pdf.log 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien à committer."; else
            git commit -m "Découverte d'une page de la Ville de Montréal ($(date -u +%Y-%m-%d))"
            git pull --rebase && git push
          fi
