# Rafraîchissement quotidien du volet Montréal (montreal/).
#
# Même mécanique que refresh.yml : chaque matin, on relance les extractions, et s'il y a du
# nouveau on committe et on pousse — Vercel redéploie. Tout se passe dans montreal/,
# qui a ses propres scrapers et ses deux dépendances (voir montreal/README.md).
#
# Secrets et variables (Settings > Secrets and variables > Actions) :
#   ANTHROPIC_API_KEY  secret — résumés en langage clair. Sans lui, l'étape est sautée et
#                      le reste tourne.
#   MTL_CONTACT        variable, facultative — ce que notre robot laisse comme contact dans
#                      son User-Agent auprès de la Ville. À défaut : l'adresse du site.

name: Rafraîchissement quotidien — volet Montréal

on:
  schedule:
    # 09:00 UTC, après DossierQuébec (08:00) et le volet Québec (08:30), pour que les journaux du
    # matin se lisent dans l'ordre. Chaque volet a maintenant son propre groupe (voir plus bas).
    - cron: '0 9 * * *'
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main
    inputs:
      resumes_complets:
        description: "Résumés IA de toute l'année, par lots (moitié prix) — pour rattraper d'un coup"
        type: boolean
        default: false

permissions:
  contents: write

# Son propre groupe (24 septembre 2026, comme Québec depuis le 18) : ce job peut durer des
# heures, et avec le groupe partagé « refresh-data » il faisait annuler sans bruit les runs des
# autres volets restés en attente. Les outils de découverte de Montréal partagent ce groupe :
# eux aussi écrivent dans montreal/data.
concurrency:
  group: refresh-montreal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Quelques minutes en régime établi. La première fois, la reconstitution du calendrier
    # des 19 conseils d'arrondissement cherche les dates de séance en essayant des URL :
    # jusqu'à une heure, une seule fois, puisqu'une séance trouvée n'est jamais re-sondée.
    # Le calendrier est écrit après chaque arrondissement, donc un run coupé ne perd rien
    # et le suivant reprend où il en était.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: montreal
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      # Le même fichier vit sur master pour que « Run workflow » soit possible depuis
      # GitHub sur n'importe quelle branche. Tant que le volet n'y est pas, il n'y a rien à
      # faire ici — on le dit et on s'arrête proprement.
      - name: Vérifier que le volet est présent
        id: volet
        working-directory: .
        run: |
          if [ -f montreal/package.json ]; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
          else
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de dossier montreal/ sur cette branche — rien à rafraîchir."
          fi

      - name: Installer Node.js
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dépendances (SDK Anthropic, pdf.js)
        if: ${{ steps.volet.outputs.present == 'oui' }}
        run: npm ci --omit=dev

      # Le texte extrait des PDF (data/textes/, hors dépôt) d'un run à l'autre : relire une
      # séance déjà téléchargée ne redemande rien à la Ville. Clé unique par run, restauration
      # depuis le run précédent.
      - name: Restaurer le cache de texte des PDF
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/cache/restore@v4
        with:
          path: montreal/data/textes
          key: textes-montreal-${{ github.run_id }}
          restore-keys: |
            textes-montreal-

      - name: Rafraîchir les données municipales
        if: ${{ steps.volet.outputs.present == 'oui' }}
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MTL_CONTACT: ${{ vars.MTL_CONTACT }}
        # Le journal part avec les données : on le lit sur GitHub sans ouvrir le run.
        run: |
          set -o pipefail
          npm run refresh -- ${{ inputs.resumes_complets == true && '--resumes-complets' || '' }} 2>&1 | tee data/lancement.log

      # Seul montreal/data/ bouge (data/textes/ est ignoré par git). On rebase avant
      # de pousser au cas où quelqu'un aurait poussé pendant le job.
      - name: Committer et pousser s'il y a des changements
        if: ${{ steps.volet.outputs.present == 'oui' }}
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add montreal/data
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
          else
            git commit -m "Rafraîchissement auto du volet Montréal ($(date -u +%Y-%m-%d))"
            # Deux raisons de réessayer : un autre workflow a pu pousser pendant le job, et
            # GitHub refuse parfois le push sur une erreur interne de son côté — c'est ce qui
            # a perdu la journée du 24 septembre 2026, sans rien de cassé chez nous.
            for essai in 1 2 3; do
              git pull --rebase && git push && break
              [ "$essai" = 3 ] && { echo "::error::Push refusé trois fois — rien n'est publié aujourd'hui."; exit 1; }
              echo "Push refusé (essai $essai) — nouvel essai dans $((essai * 10)) s."
              sleep $((essai * 10))
            done
          fi

      # L'action actions/cache ne sauvegarde rien quand le job finit rouge — et nos alertes le
      # mettent en rouge exprès. Le texte des PDF était donc jeté, et le lendemain le robot les
      # redemandait à la Ville pour rien. On enregistre à part, même en cas d'échec ; si ce n'est
      # pas possible (dossier absent), tant pis, ça ne doit jamais faire échouer le run.
      - name: Enregistrer le cache de texte des PDF
        if: ${{ !cancelled() && steps.volet.outputs.present == 'oui' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: montreal/data/textes
          key: textes-montreal-${{ github.run_id }}

      # !cancelled() : ces deux alertes passent après la poussée, donc un push refusé les
      # sautait — une source tombée passait inaperçue. Le texte vient de stderr : il passe par
      # une variable d'environnement, jamais par ${{ }} dans le script, que bash relirait.
      - name: Signaler les étapes secondaires en échec
        if: ${{ !cancelled() && steps.volet.outputs.present == 'oui' && steps.refresh.outputs.warnings != '' }}
        env:
          AVERTISSEMENTS: ${{ steps.refresh.outputs.warnings }}
        run: |
          echo "::warning::Étapes secondaires en échec (données de la veille conservées) : $AVERTISSEMENTS"

      - name: Alerter si une extraction principale a échoué
        if: ${{ !cancelled() && steps.volet.outputs.present == 'oui' && steps.refresh.outputs.failed != '' }}
        env:
          ECHECS: ${{ steps.refresh.outputs.failed }}
        run: |
          echo "::error::Extractions en échec (données de la veille conservées) : $ECHECS"
          exit 1
