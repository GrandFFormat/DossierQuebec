# Découverte des conseils d'arrondissement de Montréal — à lancer à la main, pas planifié.
#
# Deux choses ne se trouvent pas depuis un poste de développement qui n'atteint pas
# montreal.ca : le code que la Ville emploie pour chacun des 19 conseils d'arrondissement
# dans le nom de ses fichiers, et la source des dates de leurs séances. Ce workflow pose
# les questions à la Ville depuis un runner, écrit le rapport dans
# montreal/data/arrondissements-decouverte.json et le committe pour qu'on puisse le lire.
#
# Il ne touche à rien d'autre : aucune donnée du site n'est modifiée.

name: Découverte — conseils d'arrondissement de Montréal

on:
  workflow_dispatch:
    inputs:
      annee:
        description: "Année à sonder (les séances de cette année servent de repères)"
        required: false
        default: '2026'

permissions:
  contents: write

# Même groupe que les rafraîchissements : deux jobs ne parlent jamais à la Ville en même
# temps, et ne se marchent pas dessus au moment de pousser.
# Le même groupe que le rafraîchissement de Montréal : ces outils écrivent eux aussi dans
# montreal/data, deux à la fois se marcheraient sur les pieds au rebase.
concurrency:
  group: refresh-montreal
  cancel-in-progress: false

jobs:
  decouvrir:
    runs-on: ubuntu-latest
    # Le portail de données ouvertes impose 10 s entre deux requêtes, et le sondage d'URL
    # en fait quelques centaines à 0,6 s : large de quoi voir venir.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: montreal
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      # Le fichier peut exister sur une branche où le volet n'est pas : on le dit et on
      # s'arrête proprement, comme le workflow de rafraîchissement.
      - name: Vérifier que le volet est présent
        id: volet
        working-directory: .
        run: |
          if [ -f montreal/scrapers/decouverte-arrondissements.js ]; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
          else
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de script de découverte sur cette branche — rien à faire."
          fi

      - name: Installer Node.js
        if: ${{ steps.volet.outputs.present == 'oui' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dépendances
        if: ${{ steps.volet.outputs.present == 'oui' }}
        run: npm ci --omit=dev

      - name: Interroger la Ville
        if: ${{ steps.volet.outputs.present == 'oui' }}
        env:
          MTL_CONTACT: ${{ vars.MTL_CONTACT }}
          # L'année vient du bouton « Run workflow » : elle passe par une variable
          # d'environnement, jamais par ${{ }} dans le script, que bash réinterpréterait.
          MTL_ANNEE: ${{ inputs.annee }}
        # Le journal part avec le rapport : on le lit sur GitHub sans ouvrir le run.
        run: |
          set -o pipefail
          npm run decouvrir:arrondissements -- "$MTL_ANNEE" 2>&1 | tee data/decouverte.log

      - name: Committer le rapport
        if: ${{ always() && steps.volet.outputs.present == 'oui' }}
        working-directory: .
        run: |
          git config user.name "dossierquebec-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Un seul chemin manquant faisait échouer tout le « git add », et le rapport
          # n'était jamais committé : « fatal: pathspec … did not match any files », puis
          # « Aucun rapport à committer », alors que la sonde avait bien travaillé — jusqu'à
          # une heure de sondage chez la Ville à refaire. Un « git add » par chemin.
          git add montreal/data/arrondissements-decouverte.json 2>/dev/null || true
          git add montreal/data/decouverte.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun rapport à committer."
          else
            git commit -m "Découverte des conseils d'arrondissement de Montréal ($(date -u +%Y-%m-%d))"
            # Un refus de poussée (GitHub renvoie parfois une erreur interne) jetterait tout le
            # sondage, et il faudrait le redemander à la Ville : on réessaie avant d'abandonner.
            for essai in 1 2 3; do
              git pull --rebase && git push && break
              [ "$essai" = 3 ] && { echo "::error::Push refusé trois fois — la découverte est perdue."; exit 1; }
              echo "Push refusé (essai $essai) — nouvel essai dans $((essai * 10)) s."
              sleep $((essai * 10))
            done
          fi
