<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tableau de bord — DossierQuébec</title>
<!-- Réservé aux comptes de la table `admins`. Lit la table dq_mesures par la fonction
     dq_mesures_resume (scripts/supabase-dq-mesures.sql) : où vont les gens et sur quoi ils pèsent,
     site de l'Assemblée et volets de ville. Pas de Google Analytics ni de Vercel ici : on ne se
     mesure pas soi-même. -->
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Archivo+Narrow:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/commun/dq.css">
<style>
  .tb{max-width:1100px; margin:0 auto; padding:28px 20px 80px;}
  .tb h1{font-size:34px; font-weight:900; letter-spacing:-.02em; margin:0 0 4px;}
  .tb .sous{color:var(--slate); margin:0 0 22px; font-size:15px;}
  .tb-periodes{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 20px;}
  .tb-periodes button{font-family:'Archivo',sans-serif; font-size:14px; font-weight:800; padding:8px 14px; background:var(--card); color:var(--ink); border:3px solid var(--ink); cursor:pointer;}
  .tb-periodes button[aria-pressed="true"]{background:var(--ink); color:var(--card);}
  .tb-chiffres{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; margin:0 0 22px;}
  .tb-chiffre{border:3px solid var(--ink); background:var(--card); box-shadow:var(--shadow-sm); padding:14px 16px 12px; border-top:10px solid var(--gold);}
  .tb-chiffre b{display:block; font-size:38px; font-weight:900; line-height:1.1;}
  .tb-chiffre span{display:block; color:var(--slate); font-size:14px; margin-top:4px;}
  .tb-grille{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:18px;}
  .tb-carte{border:3px solid var(--ink); background:var(--card); box-shadow:var(--shadow-sm); padding:14px 16px 12px; min-width:0;}
  .tb-carte.large{grid-column:1 / -1;}
  .tb-carte h2{font-size:18px; font-weight:900; margin:0 0 4px;}
  .tb-carte .aide{color:var(--slate); font-size:13px; margin:0 0 10px; line-height:1.4;}
  .tb-table{width:100%; border-collapse:collapse; font-size:14px;}
  .tb-table td{padding:6px 4px; border-top:2px solid var(--line-soft); vertical-align:top;}
  .tb-table td:last-child{text-align:right; font-weight:800; white-space:nowrap;}
  .tb-table .petit{display:block; color:var(--slate); font-size:12px; word-break:break-all;}
  .tb-barre{display:block; height:6px; background:var(--gold); margin-top:4px;}
  .tb-jours{display:flex; align-items:flex-end; gap:3px; height:140px; margin:8px 0 2px;}
  .tb-jour{flex:1; min-width:4px; background:var(--ink); position:relative;}
  .tb-jour:hover{background:var(--gold);}
  .tb-jour i{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--card); font-style:normal; font-size:11px; padding:2px 6px; white-space:nowrap; display:none; margin-bottom:3px;}
  .tb-jour:hover i{display:block;}
  .tb-axe{display:flex; justify-content:space-between; color:var(--slate); font-size:12px;}
  .tb-vide{color:var(--slate); font-style:italic;}
  .tb-connexion{max-width:460px; border:3px solid var(--ink); background:var(--card); box-shadow:var(--shadow-sm); padding:18px;}
  .tb-connexion input{width:100%; font:inherit; font-size:16px; padding:9px 10px; border:3px solid var(--ink); margin:8px 0 10px; background:var(--paper); color:var(--ink);}
  .tb-connexion button, .tb-sortir{font-family:'Archivo',sans-serif; font-size:15px; font-weight:800; padding:9px 16px; background:var(--ink); color:var(--card); border:3px solid var(--ink); cursor:pointer;}
  .tb-sortir{font-size:13px; padding:5px 10px; float:right;}
  .tb-note{color:var(--slate); font-size:13px; margin:12px 0 0; line-height:1.45;}
  .tb-erreur{border:3px solid #a3261f; color:#a3261f; padding:10px 14px; font-weight:700; margin:0 0 18px;}
</style>
</head>
<body>
<main class="tb">
  <a href="/" style="font-size:13px; font-weight:800; text-decoration:none; color:var(--ink);">← DossierQuébec</a>
  <h1>Tableau de bord</h1>
  <p class="sous">Où vont les gens et sur quoi ils pèsent. Site de l'Assemblée et volets de ville, toutes langues. Aucune donnée personnelle.</p>
  <div id="tbZone"><p class="tb-vide">Chargement…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/commun/admin.js"></script>
</body>
</html>
